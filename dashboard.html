<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boz — Morning Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Boz — Morning Command Center ===== */
/* Control Room (dark) — the as-delivered accents Boz approved */
:root {
  --bg: #0D1117;
  --bg-2: #080b10;
  --card: #131B24;
  --card-2: #0f1620;
  --border: rgba(125,155,185,0.12);
  --border-strong: rgba(125,155,185,0.22);
  --text: #EAF4FF;
  --text-mid: #93a6b8;
  --text-dim: #5A7080;
  --teal: #00E5FF;
  --orange: #FF6B9D;
  --gold: #FFD166;
  --red: #FF4D6D;
  --gm: 1;
  --num-font: 'Orbitron';
  --scan: rgba(255,255,255,0.016);
  --shadow: 0 14px 38px rgba(0,0,0,0.55);
  --track: rgba(125,155,185,0.14);
}
/* California (light) — Tag Homes scheme, matched to the brand site */
[data-theme="light"] {
  --bg: #FAF6EF;
  --bg-2: #F1EADD;
  --card: #FFFFFF;
  --card-2: #FAF5EC;
  --border: #D8D1BF;
  --border-strong: rgba(120,92,58,0.28);
  --text: #2A2E3A;
  --text-mid: #565B6B;
  --text-dim: #8B8F9C;
  --teal: #4F7BC7;
  --orange: #BD8A5E;
  --gold: #C6A24C;
  --red: #B5463E;
  --gm: 0.08;
  --scan: rgba(120,92,58,0.014);
  --shadow: 0 14px 34px rgba(96,68,40,0.13);
  --track: rgba(120,92,58,0.16);
  --num-font: 'Cormorant Garamond';
}
[data-theme="light"] body { font-family: 'Hanken Grotesk', system-ui, sans-serif; }
[data-theme="light"] .stage {
  background:
    radial-gradient(900px 620px at 14% -4%, rgba(242,185,135,0.55) 0%, transparent 60%),
    radial-gradient(820px 600px at 88% 4%, rgba(202,150,110,0.40) 0%, transparent 55%),
    radial-gradient(1100px 820px at 70% 104%, rgba(120,150,128,0.34) 0%, transparent 58%),
    var(--bg);
  background-blend-mode: normal;
}
[data-theme="light"] .stage::after { opacity: .35; }
[data-theme="light"] .card { border-radius: 20px; }
[data-theme="light"] .card::before { opacity: .8; height: 2px; }
[data-theme="light"] .brand .ttl, [data-theme="light"] .label { letter-spacing: .18em; }
[data-theme="light"] .hero .name { font-weight: 700; letter-spacing: -.01em; font-family: var(--num-font), serif; }
[data-theme="light"] .num { font-weight: 600; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  transition: background .4s ease, color .4s ease;
}

/* background field: halos + scanlines */
.stage {
  position: relative;
  min-height: 100vh;
  background:
    radial-gradient(900px 600px at 12% 0%, color-mix(in srgb, var(--teal), transparent 90%) 0%, transparent 60%),
    radial-gradient(800px 600px at 85% 8%, color-mix(in srgb, var(--orange), transparent 92%) 0%, transparent 55%),
    radial-gradient(1000px 800px at 70% 100%, color-mix(in srgb, var(--gold), transparent 94%) 0%, transparent 55%),
    var(--bg);
  background-blend-mode: screen;
}
.stage::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(to bottom, var(--scan) 0, var(--scan) 1px, transparent 1px, transparent 3px);
  opacity: calc(0.5 + var(--gm) * 0.5);
}
.wrap { position: relative; z-index: 2; max-width: 1640px; margin: 0 auto; padding: 30px 30px 44px; }

.num { font-family: var(--num-font), 'Orbitron', monospace; font-weight: 600; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--text-dim); font-weight: 600; white-space: nowrap; }

.acc-teal   { --acc: var(--teal); }
.acc-orange { --acc: var(--orange); }
.acc-gold   { --acc: var(--gold); }
.acc-red    { --acc: var(--red); }
.acc-dim    { --acc: var(--text-dim); }
.glow-text { text-shadow: 0 0 calc(18px * var(--gm)) color-mix(in srgb, var(--acc, var(--teal)), transparent 40%); }

/* ---- top app bar ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 calc(14px*var(--gm)) var(--teal); }
.brand .ttl { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--text-mid); font-weight: 600; }
.topbar .meta { display: flex; align-items: center; gap: 14px; }
.skin-switch { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; background: var(--card-2); }
.skin-switch button { padding: 8px 16px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  color: var(--text-dim); background: transparent; border: none; cursor: pointer; transition: color .2s ease, background .2s ease; }
.skin-switch button:hover { color: var(--text-mid); }
.skin-switch button.active { color: var(--bg); background: var(--teal); box-shadow: 0 0 calc(14px*var(--gm)) var(--teal); }
.chip { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim);
  border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; }
.chip b { color: var(--text); font-weight: 600; }

/* ---- grid ---- */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.col2 { grid-column: span 2; }
.col4 { grid-column: span 4; }

/* section divider labels */
.section-rule { grid-column: span 4; display: flex; align-items: center; gap: 14px; margin: 12px 0 2px; }
.section-rule:first-child { margin-top: 0; }
.section-rule .sl { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; white-space: nowrap; }
.section-rule .ln { flex: 1; height: 1px; background: linear-gradient(to right, var(--border-strong), transparent); }

@media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } .col4, .section-rule { grid-column: span 2; } }
@media (max-width: 640px)  { .grid { grid-template-columns: 1fr; } .col2, .col4, .section-rule { grid-column: span 1; } }

/* ---- card shell ---- */
.card {
  position: relative; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color .25s ease, transform .25s ease;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1.5px;
  background: var(--acc, var(--teal)); border-radius: 2px;
  box-shadow: 0 0 calc(16px * var(--gm)) var(--acc, var(--teal)), 0 0 calc(4px*var(--gm)) var(--acc, var(--teal));
  opacity: .9;
}
.card:hover { border-color: color-mix(in srgb, var(--acc, var(--border-strong)), transparent 55%); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
.card-head .label { display: flex; align-items: center; gap: 8px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 calc(10px*var(--gm)) var(--acc); }
.head-note { font-size: 12px; color: var(--text-dim); }

/* ===== Hero ===== */
.hero { display: flex; flex-direction: column; min-height: 260px; }
.hero .eyebrow { color: color-mix(in srgb, var(--teal), var(--text-dim) 20%); letter-spacing: .28em; }
.hero .name { font-size: 84px; line-height: .9; letter-spacing: .02em; margin: 10px 0 12px;
  color: var(--text); text-shadow: 0 0 calc(34px*var(--gm)) color-mix(in srgb, var(--teal), transparent 55%); }
.hero .intent { font-size: 17px; color: var(--text-mid); max-width: 30ch; line-height: 1.4; }
.hero .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: auto; padding-top: 22px; }
.stat { border-left: 2px solid color-mix(in srgb, var(--acc), transparent 40%); padding-left: 12px; }
.stat .v { font-size: 26px; color: var(--text); }
.stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); margin-top: 3px; }
.stat .d { font-size: 11px; color: var(--acc); margin-top: 5px; font-weight: 600; }

/* ===== Rings ===== */
.rings-wrap { display: flex; flex-direction: column; align-items: center; }
.ring-svg { width: 168px; height: 168px; }
.ring-center { font-size: 40px; }
.ring-center-sub { font-size: 9px; letter-spacing: .18em; color: var(--text-dim); text-transform: uppercase; }
.ring-legend { width: 100%; margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
.ring-legend .row { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.ring-legend .nm { color: var(--text-mid); flex: 1; }
.ring-legend .vl { color: var(--text); font-size: 12px; }

/* ===== KPI ===== */
.kpi-big { font-size: 40px; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
.bar { height: 7px; border-radius: 6px; background: var(--track); overflow: hidden; margin: 14px 0 8px; }
.bar > span { display: block; height: 100%; border-radius: 6px; background: var(--acc); box-shadow: 0 0 calc(12px*var(--gm)) var(--acc); }
.bar-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); }
.bar-meta b { color: var(--text); font-weight: 600; }
.stages { display: flex; gap: 8px; margin-top: 16px; }
.stage-pill { flex: 1; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
.stage-pill .c { font-size: 21px; color: var(--text); }
.stage-pill .n { font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }
.trend { font-size: 12px; font-weight: 600; color: var(--acc); }
.manual-tag { font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
  border: 1px dashed var(--border-strong); border-radius: 999px; padding: 3px 8px; }

/* ===== Portfolio KPI strip ===== */
.pf-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.pf-kpi { background: var(--card-2); border: 1px solid var(--border); border-left: 2px solid var(--acc); border-radius: 12px; padding: 14px 16px; }
.pf-kpi .v { font-size: 28px; color: var(--text); line-height: 1.05; }
.pf-kpi .l { font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }
.pf-kpi .s { font-size: 10.5px; color: var(--text-mid); margin-top: 4px; }
@media (max-width: 900px) { .pf-kpis { grid-template-columns: repeat(2, 1fr); } }

/* ===== Habit tracker ===== */
.habits { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.habit { display: flex; align-items: center; gap: 13px; background: var(--card-2);
  border: 1px solid var(--border); border-radius: 13px; padding: 14px; cursor: pointer; transition: all .2s ease; }
.habit:hover { border-color: color-mix(in srgb, var(--acc), transparent 55%); }
.habit.done { border-color: color-mix(in srgb, var(--acc), transparent 35%);
  box-shadow: inset 0 0 calc(26px*var(--gm)) color-mix(in srgb, var(--acc), transparent 86%); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--text-dim);
  display: grid; place-items: center; flex-shrink: 0; transition: all .2s ease; color: transparent; }
.habit.done .check { border-color: var(--acc); background: color-mix(in srgb, var(--acc), transparent 80%);
  color: var(--acc); box-shadow: 0 0 calc(12px*var(--gm)) color-mix(in srgb, var(--acc), transparent 55%); }
.habit .nm { font-size: 14px; color: var(--text); font-weight: 600; }
.habit .nt { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.habit .streak { margin-left: auto; text-align: right; }
.habit .streak .s { font-size: 18px; color: var(--acc); }
.habit .streak .sl { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

/* ===== Task lists ===== */
.tasks { display: flex; flex-direction: column; gap: 2px; }
.task { display: flex; align-items: center; gap: 11px; padding: 11px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.task:last-child { border-bottom: none; }
.task .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--text-dim); flex-shrink: 0;
  display: grid; place-items: center; color: transparent; transition: all .18s ease; }
.task.done .box { background: var(--acc); border-color: var(--acc); color: var(--bg); }
.task .tt { font-size: 13px; color: var(--text); flex: 1; }
.task.done .tt { color: var(--text-dim); text-decoration: line-through; }
.task .pri { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.pri-high { background: var(--red); box-shadow: 0 0 calc(8px*var(--gm)) var(--red); }
.pri-med  { background: var(--orange); }
.pri-low  { background: var(--teal); }
.task .due { font-size: 10px; color: var(--text-dim); width: 48px; text-align: right; flex-shrink: 0; letter-spacing: .04em; }

/* ===== Real estate ===== */
.re-row { display: flex; align-items: center; gap: 13px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.re-row:last-child { border-bottom: none; }
.re-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--card-2); border: 1px solid var(--border);
  display: grid; place-items: center; flex-shrink: 0; color: var(--acc); }
.re-main { flex: 1; min-width: 0; }
.re-main .a { font-size: 13px; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.re-main .b { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.re-amt { text-align: right; flex-shrink: 0; min-width: 92px; }
.re-amt .m { font-size: 14px; color: var(--text); }
.re-amt .late { font-size: 10px; color: var(--red); margin-top: 3px; font-weight: 600; }
.re-row.is-late .re-amt .m { color: var(--red); }
.re-row.is-late .re-ico { color: var(--red); border-color: color-mix(in srgb, var(--red), transparent 60%); }
.status-tag { font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; font-weight: 700;
  background: color-mix(in srgb, var(--acc), transparent 84%); color: var(--acc); border: 1px solid color-mix(in srgb, var(--acc), transparent 60%);
  white-space: nowrap; }
.late-count { color: var(--red); font-weight: 700; }

/* ===== Weekly calendar ===== */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.day { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; min-height: 120px; }
.day.today { border-color: color-mix(in srgb, var(--teal), transparent 30%);
  box-shadow: inset 0 0 calc(30px*var(--gm)) color-mix(in srgb, var(--teal), transparent 85%); }
.day .dl { font-size: 9px; letter-spacing: .14em; color: var(--text-dim); }
.day.today .dl { color: var(--teal); }
.day .dn { font-size: 22px; color: var(--text); margin: 2px 0 10px; }
.day.today .dn { color: var(--teal); text-shadow: 0 0 calc(14px*var(--gm)) color-mix(in srgb, var(--teal), transparent 50%); }
.ev { font-size: 10px; color: var(--text-mid); margin-bottom: 6px; line-height: 1.3; }
.ev b { color: var(--text-dim); font-weight: 600; margin-right: 4px; font-family: var(--num-font), monospace; }
@media (max-width: 900px) { .week { grid-template-columns: repeat(2, 1fr); } }

/* ===== Important dates ===== */
.dates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.drow { display: flex; align-items: center; gap: 14px; background: var(--card-2); border: 1px solid var(--border);
  border-left: 2px solid var(--acc); border-radius: 11px; padding: 13px 15px; }
.dcount { text-align: center; flex-shrink: 0; min-width: 52px; }
.dcount .n { font-size: 26px; color: var(--acc); line-height: 1; }
.dcount .u { font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }
.dmain { flex: 1; min-width: 0; }
.dmain .l { font-size: 14px; color: var(--text); font-weight: 600; }
.dmain .p { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
.dmain .dt { font-size: 11px; color: var(--text-mid); font-family: var(--num-font), monospace; }
@media (max-width: 900px) { .dates { grid-template-columns: 1fr; } }

/* ===== Intention banner ===== */
.banner { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 26px; align-items: center; }
.banner .quote-side { border-left: 2px solid var(--teal); padding-left: 20px; }
.banner .qmark { font-size: 13px; letter-spacing: .2em; color: var(--teal); text-transform: uppercase; margin-bottom: 10px; }
.banner .quote { font-size: 22px; line-height: 1.35; color: var(--text); font-weight: 500; text-wrap: balance; }
.goals { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.goal { display: flex; align-items: center; gap: 11px; background: var(--card-2); border: 1px solid var(--border); border-radius: 11px; padding: 13px 14px; }
.goal .gdot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 calc(9px*var(--gm)) var(--acc); flex-shrink: 0; }
.goal .gl { font-size: 13px; color: var(--text); flex: 1; }
.goal .gck { font-size: 12px; color: var(--acc); }
.goal.todo .gl { color: var(--text-mid); }
@media (max-width: 760px) { .banner { grid-template-columns: 1fr; } }

/* sample-data notice */
.sample-note { margin-top: 26px; text-align: center; font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--text-dim); }

/* ===== Lock screen ===== */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.lock-box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.lock-box::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1.5px;
  background: var(--teal); box-shadow: 0 0 calc(16px*var(--gm)) var(--teal); }
.lock-box .ttl { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--text-mid);
  font-weight: 600; margin-bottom: 22px; }
.lock-box input { width: 100%; background: var(--card-2); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 13px 14px; color: var(--text); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color .2s ease; }
.lock-box input:focus { border-color: color-mix(in srgb, var(--teal), transparent 45%); }
.lock-box button { width: 100%; margin-top: 12px; background: var(--teal); color: var(--bg);
  border: none; border-radius: 10px; padding: 13px; font-size: 11px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; cursor: pointer; font-family: inherit;
  box-shadow: 0 0 calc(14px*var(--gm)) var(--teal); }
.lock-box button:disabled { opacity: .5; cursor: default; box-shadow: none; }
.lock-box .err { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 16px; }

/* ===== Connection notice ===== */
.notice { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border); border-left: 2px solid var(--gold);
  border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; }
.notice .nt { font-size: 13px; color: var(--text-mid); flex: 1; min-width: 240px; }
.notice .nt b { color: var(--text); font-weight: 600; }
.notice a { color: var(--teal); font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; text-decoration: none; border: 1px solid color-mix(in srgb, var(--teal), transparent 60%);
  border-radius: 999px; padding: 8px 14px; white-space: nowrap; }
.notice a:hover { background: color-mix(in srgb, var(--teal), transparent 88%); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ═══════════════════════════════════════════════════════════
   SAMPLE DATA — pass 1 only. Every value here is replaced in
   passes 2-4 by one call to the backend returning this shape.
   Property rows use Boz's real deals so the layout is judged

      <div className="tasks">
        {items.map(t => (

/* ─────────────── Health rings ─────────────── */
function Rings({ d }) {
  const acc = { teal: "var(--teal)", orange: "var(--orange)", gold: "var(--gold)" };

  const cx = 84, cy = 84;
  return (
    <div className="card acc-teal">
      <CardHead label="Health HQ" accent="teal" right={<div className="num head-note">SCORE</div>} />
      <div className="rings-wrap">
        <div style={{ position: "relative", width: 168, height: 168 }}>
          <svg className="ring-svg" viewBox="0 0 168 168">
            {d.rings.map((r, i) => {
              const R = radii[i], C = 2 * Math.PI * R, col = acc[r.accent];
              return (
                <g key={i} transform={`rotate(-90 ${cx} ${cy})`}>
                  <circle cx={cx} cy={cy} r={R} fill="none" stroke="var(--track)" strokeWidth="9" />
                  <circle cx={cx} cy={cy} r={R} fill="none" stroke={col} strokeWidth="9" strokeLinecap="round"
                    strokeDasharray={C} strokeDashoffset={C * (1 - r.pct / 100)}
                    style={{ filter: "drop-shadow(0 0 calc(6px*var(--gm)) " + col + ")" }} />
                </g>
              );
            })}
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}>
            <div style={{ textAlign: "center" }}>
              <div className="num ring-center acc-teal glow-text">{d.score}</div>
              <div className="ring-center-sub">Composite</div>
            </div>
          </div>
        </div>
        <div className="ring-legend">
          {d.rings.map((r, i) => (
            <div className={"row acc-" + r.accent} key={i}>
              <span className="led" />
              <span className="nm">{r.label}</span>
              <span className="num vl">{r.value}<span style={{ color: "var(--text-dim)" }}> / {r.target}</span></span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─────────────── Habits ─────────────── */

/* ─────────────── Lock screen ─────────────── */
function LockScreen({ onUnlock }) {
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr("");
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (r.ok) { onUnlock(); return; }
      setErr(r.status === 401 ? "That's not it." : "Something went wrong. Try again.");
    } catch {
      setErr("Couldn't reach the server.");
    }
    setBusy(false);
  };

  return (
    <div className="stage">
      <div className="lock">
        <form className="lock-box" onSubmit={submit}>
          <div className="ttl">Morning Command Center</div>
          <input type="password" value={password} autoFocus placeholder="Password"
                 onChange={(e) => setPassword(e.target.value)} />
          <button type="submit" disabled={busy || !password}>{busy ? "Checking…" : "Unlock"}</button>
          <div className="err">{err}</div>
        </form>
      </div>
    </div>
  );
}

/* ─────────────── App ─────────────── */
function App() {
  const D = DASH;
  const [skin, setSkin] = useState(() => localStorage.getItem("boz-dash-skin") || "dark");
  const [quoteIdx] = useState(() => Math.floor(Math.random() * D.quotes.length));

  // "checking" until we know whether the backend is there and we're allowed in.
  const [gate, setGate] = useState("checking");
  const [portfolio, setPortfolio] = useState(D.portfolio);
  const [source, setSource] = useState("sample");   // sample | live
  const [notice, setNotice] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", skin);
    localStorage.setItem("boz-dash-skin", skin);
  }, [skin]);

  const load = React.useCallback(async () => {
    let r;
    try {
      r = await fetch("/api/portfolio");
    } catch {
      // No backend at all — running the file locally. Show the shell on sample data.
      setGate("open");
      setNotice({ text: "No backend reachable. Showing sample data." });
      return;
    }

    if (r.status === 401) { setGate("locked"); return; }
    setGate("open");

    if (r.status === 404) {
      // Served by a plain static server (local preview) — the functions aren't running.
      setNotice({ text: "No backend running. Showing sample data." });
      return;
    }

    if (r.status === 428) {
      setNotice({ text: "Google isn't connected yet, so the portfolio below is sample data.", action: "Connect Google", href: "/api/auth/google" });
      return;
    }
    if (!r.ok) {
      let msg = "Couldn't read the deal tracker.";
      try { const j = await r.json(); if (j.message) msg = j.message; } catch {}
      setNotice({ text: msg + " Showing sample data." });
      return;
    }

    const data = await r.json();
    setPortfolio({ kpis: data.kpis, properties: data.properties });
    setSource("live");
    setNotice(null);
  }, []);

  useEffect(() => { load(); }, [load]);

  if (gate === "checking") return <div className="stage" />;
  if (gate === "locked") return <LockScreen onUnlock={() => { setGate("checking"); load(); }} />;

  return (
    <div className="stage">
      <div className="wrap">
        <div className="topbar">
          <div className="brand"><span className="dot" /><span className="ttl">Morning Command Center</span></div>
          <div className="meta">
            <div className="skin-switch">
              <button className={skin === "dark" ? "active" : ""} onClick={() => setSkin("dark")}>Control Room</button>
              <button className={skin === "light" ? "active" : ""} onClick={() => setSkin("light")}>California</button>
            </div>
            <div className="chip">Sync · <b>{source}</b></div>
          </div>
        </div>

        {notice && (
          <div className="notice">
            <span className="nt">{notice.text}</span>
            {notice.action && <a href={notice.href}>{notice.action}</a>}
          </div>
        )}

        <div className="grid">
          <SectionRule>Business</SectionRule>
          <Hero d={D} />
          <Wholesaling d={D.wholesaling} />
          <TaskList label="Business Tasks" accent="orange" items={D.bizTasks} />
          <Portfolio d={portfolio} />

          <WeekStrip d={D.week} />

          <SectionRule>Personal</SectionRule>
          <Rings d={D.health} />
          <Habits d={D.habits} />
          <TaskList label="Personal Tasks" accent="teal" items={D.personalTasks} />
          <ImportantDates d={D.importantDates} />
          <Banner quote={D.quotes[quoteIdx]} goals={D.weeklyGoals} />
        </div>

        <div className="sample-note">
          {source === "live"
            ? "Portfolio is live from the deal tracker — everything else is still sample data"
            : "Sample data — no live sources connected yet"}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
